[gcode_shell_command backup_cfg]
command: ~/printer_data/config/autocommit.sh
timeout: 30
verbose: True

[gcode_macro BACKUP_CFG]
description: Backs up config directory GitHub
gcode:
    RUN_SHELL_COMMAND CMD=backup_cfg

[gcode_macro Force_Lower_Bed]
gcode:
    {% set zChange = params.zChange|default(20)|int %}
    G90
    SET_KINEMATIC_POSITION Z=0 X=150 Y=150
    G0  Z{zChange} F5000
    M84

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: BASE_QUAD_GANTRY_LEVEL
gcode:
    # Pass 1: Initial Coarse Leveling
    BASE_QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=20 RETRY_TOLERANCE=1
    # Pass 2: Fine Leveling and Accuracy
    BASE_QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=4

[gcode_macro EDDY_CALIBRATE_USED_TOOLS]
description: Calibrate offsets for the tools this print actually uses
gcode:
    {% set sx = printer.toolhead.position.x %}
    {% set sy = printer.toolhead.position.y %}
    {% set sz = printer.toolhead.position.z %}
    {% set used = [] %}
    {% for key in params %}
        {% if key.startswith('T') and key.endswith('_TEMP') and key[1:-5].isdigit() %}
            {% set _ = used.append(key[1:-5]|int) %}
        {% endif %}
    {% endfor %}
    {% if used|length > 1 %}
        {% set tools = ([0] + used)|unique|list|sort %}
        EDDY_CALIBRATE_OFFSET T={tools|join(',')}
        T0
        G28 Z
    {% endif %}
    G90
    G1 X{sx} Y{sy} F6000
    G1 Z{sz} F1200
    
[gcode_macro PRINT_START]
variable_soak_minutes = 10    # full soak from a cold printer
gcode:
    {% set TOOL = params.TOOL | default(0)| int %}
    {% set TOOL_TEMP = params.TOOL_TEMP | default(0) | int %}
    {% set BED_TEMP = params.BED_TEMP | default(0) | int %}
    {% set filamenttype = params.FILAMENT_TYPE | string %}
    # bed already hot at start = back-to-back print, frame is already warm
    {% set bed_was_hot = printer.heater_bed.temperature >= BED_TEMP - 5 %}
    {% set SOAK = params.SOAK | default(2 if bed_was_hot else soak_minutes) | int %}
    CLEAR_PAUSE
    INITIALIZE_TOOLCHANGER
    
    M104 T0 S150          # heat the probing nozzle together with the bed
    M190 S{BED_TEMP}
    M109 T0 S150          # wait until T0 is really at 150
    M117 Heat soak {SOAK} min
    RESPOND MSG="Heat soak: {SOAK} min"
    G4 P{SOAK * 60000}

    G28
    T0
    QUAD_GANTRY_LEVEL
    G28 Z

    EDDY_CALIBRATE_USED_TOOLS {rawparams}

    BED_MESH_CALIBRATE ADAPTIVE=1

    #{% if TOOL > 0 %}
    #M104 T0 S0
    #{% endif %}
    #T{TOOL}

    #M117 Waiting on T{params.TOOL} S{TOOL_TEMP}C
    #M109 S{TOOL_TEMP}
    {% if TOOL > 0 %}
    M104 T0 S0
    {% endif %}
    T{TOOL}

    # heat every other tool this print uses; the tool pickup waits for this target
    {% for key in params %}
      {% if key.startswith('T') and key.endswith('_TEMP') and key[1:-5].isdigit() and key[1:-5]|int != TOOL %}
    M104 T{key[1:-5]} S{params[key]}
      {% endif %}
    {% endfor %}

    M117 Waiting on T{params.TOOL} S{TOOL_TEMP}C
    M109 S{TOOL_TEMP}

    
    G92 E0
    #G1 E+2.0 F3600

    SKEW_PROFILE LOAD=ScanNTune

    {% set ns = namespace(z_offset=0.34) %}
    {% if filamenttype|upper in ["PLA"] %}
    {% set ns.z_offset = 0.34 %}
    {% elif filamenttype|upper == "PETG" %}
    {% set ns.z_offset = 0.375 %}
    {% endif %}

    SET_GCODE_OFFSET Z={ns.z_offset}
    
    
[gcode_macro PRINT_END]
gcode:
  {% set th = printer.toolhead %}
  {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
  {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
  {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}

  M220 S100 ; Set Feed rate to 100%
  M221 S100 ; Set Flow rate to 100%

  G92 E0 ; zero the extruder
  #G1 E-2.0 F3600 ; retract filament
  M400 ; wait for buffer to clear

  T0 ; Switch to tool 0

  G90 ; absolute positioning
  G0 X{x_safe} Y{y_safe} Z{z_safe} F20000 ; move nozzle to remove stringing
  G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600 ; park nozzle at rear

  SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0 ; reset gcode offset

  {% for tn in printer.toolchanger.tool_numbers %}
      M104 S0 T{tn} ; shutdown tool heater
      M107 T{tn} ; shutdown tool fan
      SET_STEPPER_ENABLE STEPPER=extruder{tn if tn > 0 else ''} ENABLE=0 ; disable extruder stepper
  {% endfor %}

  M140 S0 ; shutdown bed heater


[gcode_macro PRIME_LINE]
description: Prime the active nozzle with a line at the front of the bed
gcode:
    {% set th = printer.toolhead %}
    {% set ext = th.extruder %}
    {% set length = params.LENGTH|default(40)|float %}
    {% set x0 = params.X|default(20)|float %}
    {% set y = params.Y|default(10)|float %}
    {% set height = params.HEIGHT|default(0.3)|float %}
    {% set speed = params.SPEED|default(25)|float %}
    {% set purge = params.PURGE|default(1.5)|float %}
    {% if 'xyz' not in th.homed_axes %}
      { action_raise_error("PRIME_LINE: home all axes first") }
    {% endif %}
    {% if ext == '' or not printer[ext].can_extrude %}
      { action_raise_error("PRIME_LINE: active extruder is not hot enough") }
    {% endif %}
    {% set cfg = printer.configfile.settings[ext] %}
    {% set width = params.WIDTH|default(cfg.nozzle_diameter * 2)|float %}
    {% set e_line = length * width * height / (3.14159265 * (cfg.filament_diameter / 2) ** 2) %}
    {% set x1 = x0 + length %}
    {% if x0 < th.axis_minimum.x or x1 + 5 > th.axis_maximum.x or y < th.axis_minimum.y or y > th.axis_maximum.y %}
      { action_raise_error("PRIME_LINE: line would leave the travel limits") }
    {% endif %}
    SAVE_GCODE_STATE NAME=_prime_line
    G90
    M83
    G0 Z5 F1200
    G0 X{x0} Y{y} F6000
    G0 Z{height} F600
    G1 E{purge} F300
    G1 X{x1} E{e_line|round(4)} F{speed * 60}
    G1 X{x1 + 5} F{speed * 60}
    G0 Z2 F600
    RESTORE_GCODE_STATE NAME=_prime_line


[gcode_macro Z_BELT_NORMALIZE]
description: Run Z through its full travel to even out the Z belts, then optionally park
gcode:
    {% set th = printer.toolhead %}
    {% set top_margin = params.TOP_MARGIN|default(5)|float %}
    {% set bottom = params.BOTTOM|default(10)|float %}
    {% set speed = params.SPEED|default(20)|float %}
    {% set offset = printer.gcode_move.homing_origin.z %}
    {% set z_top = th.axis_maximum.z - top_margin %}
    {% set z_bottom = [bottom, th.axis_minimum.z]|max %}
    {% if 'z' not in th.homed_axes %}
        { action_raise_error("Z_BELT_NORMALIZE: home the printer first (G28)") }
    {% endif %}
    SAVE_GCODE_STATE NAME=_z_belt_normalize
    G90
    G0 Z{z_top - offset} F{speed * 60}
    G0 Z{z_bottom - offset} F{speed * 60}
    {% if params.PARK is defined %}
        G0 Z{params.PARK|float - offset} F{speed * 60}
    {% endif %}
    RESTORE_GCODE_STATE NAME=_z_belt_normalize