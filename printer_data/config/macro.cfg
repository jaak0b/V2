#####################################################################
#   Print start
#####################################################################

[gcode_macro PRINT_START]
description: Beacon contact print start (Trident sequence, no chamber)
variable_probe_temp: 150
variable_soak_minutes: 10
variable_settle_minutes: 1
variable_expansion_offset: 0.12
variable_soak_z: 200
gcode:
    {% set bedtemp = params.BED|default(60)|int %}
    {% set hotendtemp = params.HOTEND|default(220)|int %}
    {% set bed_was_hot = printer.heater_bed.temperature >= bedtemp - 5 %}
    {% set SOAK = params.SOAK|default(2 if bed_was_hot else soak_minutes)|float %}

    UPDATE_DELAYED_GCODE ID=_END_HEATERS_OFF DURATION=0
    {% if printer.hotendchanger.active_tool is none %}
        INITIALIZE_HOTENDCHANGER T=0
    {% endif %}
    CLEAR_PAUSE
    BED_MESH_CLEAR
    SET_GCODE_OFFSET Z=0
    G90
    M83

    M104 S{probe_temp}
    G28
    G0 Z{soak_z} F600

    M190 S{bedtemp}
    {% if SOAK > 0 %}
        M117 Heat soak {SOAK} min
        RESPOND MSG="Heat soak: {SOAK} min"
        G4 P{(SOAK * 60000)|int}
    {% endif %}

    G0 Z2 F600
    M109 S{probe_temp}
    {% if settle_minutes > 0 %}
        RESPOND MSG="Beacon settle: {settle_minutes} min"
        G4 P{(settle_minutes * 60000)|int}
    {% endif %}

    G28 Z METHOD=CONTACT CALIBRATE=1
    QUAD_GANTRY_LEVEL
    BED_MESH_CALIBRATE RUNS=2 ADAPTIVE=1
    G28 Z METHOD=CONTACT CALIBRATE=0

    SMART_PARK
    M109 S{hotendtemp}
    SET_GCODE_OFFSET Z={expansion_offset}
    LINE_PURGE

#####################################################################
#   Print end
#####################################################################

[gcode_macro PRINT_END]
description: Retract, hotend off, park at the back; bed off after 5 min
variable_retract: 5
gcode:
    {% set th = printer.toolhead %}
    {% set z_safe = [th.position.z + 10, th.axis_maximum.z]|min %}

    M400
    M83
    {% if printer.extruder.can_extrude %}
        G1 E-{retract} F1800
    {% endif %}
    M104 S0
    UPDATE_DELAYED_GCODE ID=_END_HEATERS_OFF DURATION=300
    M107
    BED_MESH_CLEAR
    SET_GCODE_OFFSET Z=0
    G90
    G0 Z{z_safe} F3600
    G0 X{th.axis_maximum.x / 2} Y{th.axis_maximum.y - 10} F6000

[delayed_gcode _END_HEATERS_OFF]
gcode:
    TURN_OFF_HEATERS

#####################################################################
#   Pause / resume / cancel
#####################################################################

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% set z = params.Z|default(10)|int %}

    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}

        SAVE_GCODE_STATE NAME=PAUSE
        BASE_PAUSE
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}
            G91
            G1 Z{z} F900
        {% else %}
            { action_respond_info("Pause zhop exceeds maximum Z height.") }
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        G90
        G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y-10} F6000
        SAVE_GCODE_STATE NAME=PAUSEPARK
        M104 S0
        SET_IDLE_TIMEOUT TIMEOUT=7200
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    {% set e = params.E|default(2.5)|float %}

    {% if printer['pause_resume'].is_paused|int == 1 %}
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
        {% if etemp > 0 %}
            M109 S{etemp|int}
        {% endif %}

        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=300
        G91
        M83
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
            G1 E{e} F900
        {% endif %}

        RESTORE_GCODE_STATE NAME=PAUSE
        BASE_RESUME
    {% endif %}

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    CLEAR_PAUSE
    PRINT_END
    BASE_CANCEL_PRINT

#####################################################################
#   Bed target cancels the post-print heater-off timer
#####################################################################

[gcode_macro M140]
rename_existing: M140.1
description: Set bed temperature (a target > 0 cancels the post-print heater-off timer)
gcode:
    {% if params.S|default(0)|float > 0 %}
        UPDATE_DELAYED_GCODE ID=_END_HEATERS_OFF DURATION=0
    {% endif %}
    M140.1 {rawparams}

[gcode_macro M190]
rename_existing: M190.1
description: Set bed temperature and wait (a target > 0 cancels the post-print heater-off timer)
gcode:
    {% if params.S|default(0)|float > 0 %}
        UPDATE_DELAYED_GCODE ID=_END_HEATERS_OFF DURATION=0
    {% endif %}
    M190.1 {rawparams}

[gcode_macro SET_HEATER_TEMPERATURE]
rename_existing: _SET_HEATER_TEMPERATURE_BASE
description: Set a heater target (bed target > 0 cancels the post-print heater-off timer)
gcode:
    {% set heater = params.HEATER|default("")|lower %}
    {% if heater == "heater_bed" and params.TARGET|default(0)|float > 0 %}
        UPDATE_DELAYED_GCODE ID=_END_HEATERS_OFF DURATION=0
    {% endif %}
    _SET_HEATER_TEMPERATURE_BASE {rawparams}
