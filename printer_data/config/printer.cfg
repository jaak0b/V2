[include macro.cfg]
[include mainsail.cfg]


[idle_timeout]
timeout: 10800
 
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_2B0004000251313239393734-if00

[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: corexy
max_velocity: 5000  
max_accel: 30000    			#Max 4000

#max_z_velocity: 15 			#Max 15 for 12V TMC Drivers, can increase for 24V
#max_z_accel: 350

max_z_velocity: 40 #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 200
square_corner_velocity: 5.0

[stepper_y]
step_pin: PD4
dir_pin: PD3
enable_pin: !PD6
microsteps: 16
rotation_distance: 40
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin:^PC15
position_min: -110
##--------------------------------------------------------------------
position_endstop: 300
position_max: 300

##--------------------------------------------------------------------
homing_speed: 25   #Max 100
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD5
#spi_software_miso_pin: PG7
#spi_software_sclk_pin: PG8
#spi_software_mosi_pin: PG6
interpolate: True
run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 0


[stepper_x]
step_pin: PB4
dir_pin: PB3
enable_pin: !PB6
microsteps: 16
rotation_distance: 40
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin:  ^PF0
position_min: 0
##--------------------------------------------------------------------
position_endstop: 300
position_max: 300

##--------------------------------------------------------------------
homing_speed: 25   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PB5
#spi_software_miso_pin: PG7
#spi_software_sclk_pin: PG8
#spi_software_mosi_pin: PG6
interpolate: True
run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z1 Stepper - Front Right on Motor7
[stepper_z]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

endstop_pin: probe:z_virtual_endstop
position_max: 288


##--------------------------------------------------------------------
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PC13
#spi_software_miso_pin: PG7
#spi_software_sclk_pin: PG8
#spi_software_mosi_pin: PG6
interpolate: true
run_current: 1.35
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z1 Stepper - Rear Left - Motor3
[stepper_z1]
step_pin: PE2
dir_pin: !PE1
enable_pin: !PE4
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z1]
uart_pin: PE3
#spi_software_miso_pin: PG7
#spi_software_sclk_pin: PG8
#spi_software_mosi_pin: PG6
interpolate: true
run_current: 1.35
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z2 Stepper - Rear Right on Motor6
[stepper_z2]
step_pin: PG13
dir_pin: PG12
enable_pin: !PG15
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z2]
uart_pin: PG14
#spi_software_miso_pin: PG7
#spi_software_sclk_pin: PG8
#spi_software_mosi_pin: PG6
interpolate: true
run_current: 1.35
sense_resistor: 0.110
stealthchop_threshold: 0


## Z0 Stepper - Front Left on MOTOR3_A
[stepper_z3]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PE0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z3]
uart_pin: PB9
#spi_software_miso_pin: PG7
#spi_software_sclk_pin: PG8
#spi_software_mosi_pin: PG6
interpolate: true
run_current: 1.35
sense_resistor: 0.110
stealthchop_threshold: 0

[autotune_tmc stepper_x]
motor: ldo-42sth48-2504ah
voltage: 24
tuning_goal: performance
 
[autotune_tmc stepper_y]
motor: ldo-42sth48-2504ah
voltage: 24
tuning_goal: performance
 
[autotune_tmc stepper_z]
motor: moons-ms17hd6p4200
voltage: 24
tuning_goal: performance
 
[autotune_tmc stepper_z1]
motor: moons-ms17hd6p4200
voltage: 24
tuning_goal: performance
 
[autotune_tmc stepper_z2]
motor: moons-ms17hd6p4200
voltage: 24
tuning_goal: performance
 
[autotune_tmc stepper_z3]
motor: moons-ms17hd6p4200
voltage: 24
tuning_goal: performance
 
#####################################################################
#   Fans
#####################################################################

[multi_pin tmc_fans] 
pins: PF8, PF6

[controller_fan tmc_fan]
pin: multi_pin: tmc_fans
max_power: 1
shutdown_speed: 0.0
kick_start_time: 5.0
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, stepper_z2, stepper_z3

heater: heater_bed


[quad_gantry_level]
gantry_corners:
	-60,-10
	360,370
#	Probe points
points:
	50,25
	50,225
	250,225
	250,25

#--------------------------------------------------------------------
speed: 100
horizontal_move_z: 15
retries: 7
retry_tolerance: 0.05
max_adjust: 20

[bed_mesh]
probe_count: 5, 5
zero_reference_position: 150, 150
mesh_min: 35, 35
mesh_max: 250, 250
split_delta_z: 0.01

#####################################################################
# 	Bed Heater
#####################################################################

[heater_bed]
##	SSR Pin - HE0
heater_pin: PA0
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for NTC 100k 3950 thermistors
sensor_type: Generic 3950
sensor_pin: PB1
max_power: 1
min_temp: 0
max_temp: 120
control: pid
pid_kp: 58.437
pid_ki: 2.347
pid_kd: 363.769

#####################################################################
# 	Probe
#####################################################################

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_3F6F5D365157383837202020FF013B1E-if00
x_offset: -18.63
y_offset: 27.66
mesh_main_direction: x
mesh_runs: 2
is_non_critical: True
home_xy_position: 150, 150
home_z_hop: 3
home_method: proximity
home_method_when_homed: proximity
home_autocalibrate: never
home_y_before_x: True

#####################################################################
# 	input shaper
#####################################################################

#[resonance_tester]
#accel_chip: adxl345
#probe_points: 150, 150, 20
#accel_per_hz: 120
#sweeping_accel: 400
#sweeping_period: 0
##max_freq: 200

#[shaketune]

#[input_shaper]
#shaper_freq_x: 89.8
##shaper_type_x: ei
#damping_ratio_x: 0.065

#shaper_freq_y: 83.8
##shaper_type_y: ei
#damping_ratio_y: 0.043

#shaper_type: ei



[input_shaper]
shaper_freq_x: 54.4
shaper_type_x: mzv
damping_ratio_x: 0.041

shaper_freq_y: 52.0
shaper_type_y: mzv
damping_ratio_y: 0.069

  
[skew_correction]

#####################################################################
#   Octopus: toolhead + tools
#####################################################################

[mcu octopus]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_4A001A0019513434373238-if00

# T0: extruder motor MOTOR0, hotend HE0, thermistor TB
[extruder]
step_pin: octopus:PF13
dir_pin: octopus:PF12
enable_pin: !octopus:PF14
microsteps: 16
rotation_distance:55
full_steps_per_rotation: 200
gear_ratio: 44:10, 37:17
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: octopus:PA2
sensor_pin: octopus:PF3
sensor_type: Generic 3950
min_temp: 0
max_temp: 300
min_extrude_temp: 170

[tmc2209 extruder]
uart_pin: octopus:PC4
sense_resistor: 0.110
run_current: 0.6
interpolate: false
stealthchop_threshold: 0

# Part fan: FAN1
[fan]
pin: octopus:PE5
max_power: 1.0

# Hotend fan T0: FAN0
[heater_fan tool0_hotend_fan]
pin: octopus:PA8
heater: extruder
heater_temp: 50.0

#####################################################################
#   Hotend changer
#####################################################################

[hotendchanger]
pickup_gcode:
    {action_raise_error("hotendchanger: pickup_gcode not configured yet")}
dropoff_gcode:
    {action_raise_error("hotendchanger: dropoff_gcode not configured yet")}

[hotendchanger_tool T0]
extruder: extruder


